name: Refresh clean product assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-clean-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PWA branch
        uses: actions/checkout@v4
        with:
          ref: pwa-v17-galaxy-experience
          fetch-depth: 0

      - name: Install image dependencies
        run: python -m pip install --quiet pillow requests

      - name: Download clean official gallery renders
        shell: python
        run: |
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image
          items=[
            ("Galaxy A17 5G","assets/products/aentry/galaxy-a17-5g.png","https://images.samsung.com/is/image/samsung/p6pim/br/sm-a176bzaozto/gallery/br-galaxy-a17-5g-sm-a176-sm-a176bzaozto-548807141?$1164_776_PNG$"),
            ("Galaxy Tab S11 Ultra","assets/products/tabs/galaxy-tab-s11-ultra.png","https://images.samsung.com/is/image/samsung/p6pim/br/sm-x930nzahzto/gallery/br-galaxy-tab-s11-ultra-sm-x930-sm-x930nzahzto-548653896?$1164_776_PNG$"),
            ("Galaxy Tab A11+","assets/products/taba/galaxy-tab-a11-plus-5g.png","https://images.samsung.com/is/image/samsung/p6pim/br/sm-x236bzaazto/gallery/br-galaxy-tab-a11-plus-sm-x230-sm-x236bzaazto-550174385?$1164_776_PNG$"),
            ("Galaxy Book Go","assets/products/bookgo/galaxy-book-go.png","https://images.samsung.com/is/image/samsung/p6pim/br/np340xla-k09br/gallery/br-galaxy-book-go-np340xlaa-552529-np340xla-k09br-thumb-547306366?$1164_776_PNG$"),
          ]
          h={"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"}
          for name,path,url in items:
              r=requests.get(url,headers=h,timeout=30); r.raise_for_status()
              im=Image.open(BytesIO(r.content)); im.load()
              assert im.width>=700 and im.height>=500, (name,im.size)
              if im.mode not in ("RGB","RGBA"): im=im.convert("RGBA")
              dst=Path(path); dst.parent.mkdir(parents=True,exist_ok=True)
              im.save(dst,"PNG",optimize=True)
              print(name,im.size,dst)

      - name: Commit refreshed assets
        run: |
          git config user.name "SamsungCare Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/products/aentry/galaxy-a17-5g.png assets/products/tabs/galaxy-tab-s11-ultra.png assets/products/taba/galaxy-tab-a11-plus-5g.png assets/products/bookgo/galaxy-book-go.png
          git commit -m "polish: replace promotional renders with clean official gallery assets"
          git push origin HEAD:pwa-v17-galaxy-experience
