name: Visual audit PWA v17
# rerun: clean-assets-v17.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit-v17.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PWA branch
        uses: actions/checkout@v4
        with:
          ref: pwa-v17-galaxy-experience

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Render audit screenshots
        run: |
          python3 -m http.server 4173 >/tmp/care-http.log 2>&1 &
          cat > audit-runner.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'mobile',width:390,height:844},
            {name:'desktop',width:1365,height:900}
          ];
          const metrics={};
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await page.screenshot({path:`audit/${c.name}_home.png`,fullPage:true});
            const home=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              familyCards:document.querySelectorAll('.family-card').length,
              loadedImages:[...document.querySelectorAll('.family-card img')].filter(i=>i.complete&&i.naturalWidth>0).length,
              heroImages:[...document.querySelectorAll('.hero-product')].map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,h:i.naturalHeight,box:i.getBoundingClientRect().toJSON()}))
            }));
            await page.click('[data-family="s"]');
            await page.waitForTimeout(200);
            await page.screenshot({path:`audit/${c.name}_s.png`,fullPage:true});
            const sMetrics=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              planCards:document.querySelectorAll('.plan-card').length,
              productImg:[...document.querySelectorAll('.family-hero-art img')].map(i=>({w:i.naturalWidth,h:i.naturalHeight,box:i.getBoundingClientRect().toJSON()}))
            }));
            await page.click('[data-plan="combo"]');
            await page.waitForTimeout(100);
            await page.screenshot({path:`audit/${c.name}_modal.png`,fullPage:false});
            await page.keyboard.press('Escape');
            await page.click('#homeBtn');
            await page.waitForTimeout(120);
            await page.click('[data-family="zfold"]');
            await page.waitForTimeout(160);
            await page.screenshot({path:`audit/${c.name}_zfold.png`,fullPage:true});
            metrics[c.name]={home,s:sMetrics,errors};
            await page.close();
          }
          fs.writeFileSync('audit/metrics.json',JSON.stringify(metrics,null,2));
          await browser.close();
          JS
          mkdir -p audit
          node audit-runner.mjs

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pwa-v17-visual-audit
          path: audit/
          retention-days: 2
