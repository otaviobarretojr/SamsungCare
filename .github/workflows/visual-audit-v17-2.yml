name: Visual audit v17.2 transparent assets

on:
  push:
    branches: [v17.2-transparent-assets]
    paths:
      - '.github/workflows/visual-audit-v17-2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v17.2
        uses: actions/checkout@v4
        with:
          ref: v17.2-transparent-assets

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Render screenshots
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const cases=[{name:'mobile',width:390,height:844},{name:'desktop',width:1365,height:900}];
          const metrics={};
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await page.screenshot({path:`audit/${c.name}_home.png`,fullPage:true});
            const home=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              cards:document.querySelectorAll('.family-card').length,
              loaded:[...document.images].filter(i=>i.complete&&i.naturalWidth>0).length,
              hero:[...document.querySelectorAll('.hero-product')].map(i=>({
                cls:i.className,natural:[i.naturalWidth,i.naturalHeight],box:i.getBoundingClientRect().toJSON()
              }))
            }));
            await page.click('[data-family="s"]');
            await page.waitForTimeout(150);
            await page.screenshot({path:`audit/${c.name}_s.png`,fullPage:true});
            await page.click('#homeBtn');
            await page.waitForTimeout(100);
            await page.click('[data-family="zfold"]');
            await page.waitForTimeout(150);
            await page.screenshot({path:`audit/${c.name}_zfold.png`,fullPage:true});
            metrics[c.name]={home,errors};
            await page.close();
          }
          fs.writeFileSync('audit/metrics.json',JSON.stringify(metrics,null,2));
          await browser.close();
          JS
          mkdir -p audit
          node audit.mjs

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: samsungcare-v17-2-transparent-audit
          path: audit/
          retention-days: 2
