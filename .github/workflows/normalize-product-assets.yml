name: Normalize transparent product assets

on:
  push:
    branches: [v17.2-transparent-assets]
    paths:
      - '.github/workflows/normalize-product-assets.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v17.2
        uses: actions/checkout@v4
        with:
          ref: v17.2-transparent-assets
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Remove border-connected backgrounds and trim
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          from collections import deque
          import statistics, json

          files=sorted(Path("assets/products").glob("*/*.png"))
          assert len(files)==13, f"expected 13 assets, got {len(files)}"
          report=[]

          def bg_reference(im):
              w,h=im.size
              pts=[]
              step=max(1,min(w,h)//80)
              for x in range(0,w,step):
                  pts.append(im.getpixel((x,0))[:3]); pts.append(im.getpixel((x,h-1))[:3])
              for y in range(0,h,step):
                  pts.append(im.getpixel((0,y))[:3]); pts.append(im.getpixel((w-1,y))[:3])
              return tuple(int(statistics.median([p[i] for p in pts])) for i in range(3))

          def clean(path):
              src=Image.open(path).convert("RGBA")
              w,h=src.size
              px=src.load()
              ref=bg_reference(src)
              before_alpha=sum(1 for y in range(h) for x in range(w) if px[x,y][3] < 250)

              # Candidate background: transparent OR bright low-saturation pixel
              # close to the median border tone. Only connected pixels from the border are removed.
              def candidate(x,y):
                  r,g,b,a=px[x,y]
                  if a < 16: return True
                  spread=max(r,g,b)-min(r,g,b)
                  dist=((r-ref[0])**2+(g-ref[1])**2+(b-ref[2])**2)**0.5
                  return (min(r,g,b)>=218 and spread<=34 and dist<=48) or (min(r,g,b)>=245 and spread<=18)

              q=deque()
              seen=bytearray(w*h)
              def add(x,y):
                  i=y*w+x
                  if not seen[i] and candidate(x,y):
                      seen[i]=1; q.append((x,y))
              for x in range(w):
                  add(x,0); add(x,h-1)
              for y in range(h):
                  add(0,y); add(w-1,y)
              while q:
                  x,y=q.popleft()
                  if x>0:add(x-1,y)
                  if x+1<w:add(x+1,y)
                  if y>0:add(x,y-1)
                  if y+1<h:add(x,y+1)

              removed=0
              for y in range(h):
                  for x in range(w):
                      if seen[y*w+x]:
                          r,g,b,a=px[x,y]
                          if a:
                              px[x,y]=(r,g,b,0); removed+=1

              alpha=src.getchannel("A")
              bbox=alpha.getbbox()
              if not bbox:
                  raise RuntimeError(f"empty after processing: {path}")
              crop=src.crop(bbox)
              cw,ch=crop.size
              pad=max(8,int(max(cw,ch)*0.045))
              out=Image.new("RGBA",(cw+pad*2,ch+pad*2),(255,255,255,0))
              out.alpha_composite(crop,(pad,pad))
              out.save(path,"PNG",optimize=True)

              report.append({
                  "file":str(path),
                  "original":[w,h],
                  "output":[out.width,out.height],
                  "border_reference":ref,
                  "removed_pixels":removed,
                  "transparent_pixels_before":before_alpha,
                  "alpha_bbox":bbox,
                  "bytes":path.stat().st_size
              })

          for p in files:
              clean(p)

          Path("assets/product-processing-report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          for x in report:
              print(x["file"],x["original"],"->",x["output"],"removed",x["removed_pixels"],"bytes",x["bytes"])

      - name: Verify processed PNGs
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          files=sorted(Path("assets/products").glob("*/*.png"))
          assert len(files)==13
          for p in files:
              im=Image.open(p).convert("RGBA")
              assert im.getchannel("A").getextrema()[0] == 0, f"no transparency: {p}"
              assert im.getbbox(), p
              assert p.stat().st_size > 1500, p
              print(p,im.size,im.getchannel("A").getextrema(),p.stat().st_size)

      - name: Commit normalized assets
        run: |
          git config user.name "SamsungCare Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/products assets/product-processing-report.json
          git commit -m "polish: normalize product renders with transparent backgrounds"
          git push origin HEAD:v17.2-transparent-assets
