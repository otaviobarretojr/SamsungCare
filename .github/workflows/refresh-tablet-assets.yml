name: Refresh tablet product assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-tablet-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PWA branch
        uses: actions/checkout@v4
        with:
          ref: pwa-v17-galaxy-experience
          fetch-depth: 0

      - name: Install image dependencies
        run: python -m pip install --quiet pillow requests

      - name: Replace tablet renders with official 800x800 images
        shell: python
        run: |
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image
          items=[
            ("Galaxy Tab S11 Ultra","assets/products/tabs/galaxy-tab-s11-ultra.png","https://samsungbrshop.vtexassets.com/arquivos/ids/291276-800-auto?v=639197229859770000"),
            ("Galaxy Tab A11+","assets/products/taba/galaxy-tab-a11-plus-5g.png","https://samsungbrshop.vtexassets.com/arquivos/ids/291328-800-auto?v=639197235689530000"),
          ]
          h={"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"}
          for name,path,url in items:
              r=requests.get(url,headers=h,timeout=30); r.raise_for_status()
              im=Image.open(BytesIO(r.content)); im.load()
              assert im.size[0]>=800 and im.size[1]>=800, (name,im.size)
              if im.mode not in ("RGB","RGBA"): im=im.convert("RGBA")
              dst=Path(path); dst.parent.mkdir(parents=True,exist_ok=True)
              im.save(dst,"PNG",optimize=True)
              print(name,im.size,dst)

      - name: Commit refreshed tablet assets
        run: |
          git config user.name "SamsungCare Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/products/tabs/galaxy-tab-s11-ultra.png assets/products/taba/galaxy-tab-a11-plus-5g.png
          git commit -m "fix: replace tablet thumbnails with official 800x800 renders"
          git push origin HEAD:pwa-v17-galaxy-experience
