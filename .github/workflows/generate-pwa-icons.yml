name: Generate PWA app icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate production icons
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json

          out=Path("assets/icons")
          out.mkdir(parents=True,exist_ok=True)
          BLUE=(20,40,160)
          INK=(10,10,10)
          WHITE=(255,255,255)

          def font(size,bold=False):
              candidates=[
                "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf"
              ]
              for p in candidates:
                  if Path(p).exists(): return ImageFont.truetype(p,size)
              return ImageFont.load_default()

          def make(size,maskable=False):
              bg=BLUE if maskable else WHITE
              im=Image.new("RGBA",(size,size),bg+(255,))
              d=ImageDraw.Draw(im)
              safe=int(size*.12)
              if not maskable:
                  # subtle Galaxy-style halo
                  d.ellipse((safe,safe,size-safe,size-safe),fill=(242,244,255,255))
              # shield
              cx=size//2
              top=int(size*.23); left=int(size*.28); right=int(size*.72); bottom=int(size*.70)
              shield=[(cx,top),(right,int(size*.32)),(int(size*.68),int(size*.57)),(cx,bottom),(int(size*.32),int(size*.57)),(left,int(size*.32))]
              fill=WHITE if maskable else BLUE
              d.polygon(shield,fill=fill)
              # C+
              fg=BLUE if maskable else WHITE
              f=font(int(size*.19),True)
              text="C+"
              bb=d.textbbox((0,0),text,font=f)
              d.text((cx-(bb[2]-bb[0])/2,int(size*.39)-(bb[3]-bb[1])/2),text,font=f,fill=fg)
              # tiny Samsung wordmark-style text
              label="SAMSUNG"
              lf=font(int(size*.07),True)
              lb=d.textbbox((0,0),label,font=lf)
              ly=int(size*.78) if not maskable else int(size*.79)
              d.text((cx-(lb[2]-lb[0])/2,ly),label,font=lf,fill=INK if not maskable else WHITE)
              return im

          make(192,False).save(out/"icon-192.png",optimize=True)
          make(512,False).save(out/"icon-512.png",optimize=True)
          make(512,True).save(out/"icon-maskable-512.png",optimize=True)
          make(180,False).save(out/"apple-touch-icon.png",optimize=True)

          # update manifest
          p=Path("manifest.webmanifest")
          m=json.loads(p.read_text(encoding="utf-8"))
          m["icons"]=[
            {"src":"assets/icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
            {"src":"assets/icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
            {"src":"assets/icons/icon-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
          ]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # update HTML head
          h=Path("index.html")
          s=h.read_text(encoding="utf-8")
          if 'apple-touch-icon' not in s:
              s=s.replace('<link rel="manifest" href="manifest.webmanifest">','<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">')
          h.write_text(s,encoding="utf-8")

          # cache icons
          sw=Path("sw.js")
          s=sw.read_text(encoding="utf-8")
          marker="assets/assets-manifest.json"
          inject=['assets/icons/icon-192.png','assets/icons/icon-512.png','assets/icons/icon-maskable-512.png','assets/icons/apple-touch-icon.png']
          if all(x not in s for x in inject):
              s=s.replace('"assets/assets-manifest.json"', '"assets/assets-manifest.json",'+','.join(json.dumps(x) for x in inject))
          sw.write_text(s,encoding="utf-8")

      - name: Verify icons
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          expected={
            "assets/icons/icon-192.png":(192,192),
            "assets/icons/icon-512.png":(512,512),
            "assets/icons/icon-maskable-512.png":(512,512),
            "assets/icons/apple-touch-icon.png":(180,180),
          }
          for path,size in expected.items():
              im=Image.open(path)
              assert im.size==size,(path,im.size)
              print(path,im.size,Path(path).stat().st_size)

      - name: Commit icons
        run: |
          git config user.name "SamsungCare PWA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/icons manifest.webmanifest index.html sw.js
          git commit -m "feat: add installable PWA app icons"
          git push origin main
